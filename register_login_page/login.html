<!DOCTYPE html>
<html>
<head>
<title>Welcome | Login Page</title>
</head>
<body>
    <center>
        <h1>Welcome Back!</h1>
        <h2><b>Login to Your Account</b></h2>
        <p>Please enter your details to continue.</p>
        <hr width="350">
        <form action="#" method="post">
            <table cellpadding="8">
                <tr>
                    <td>
                        <label for="username">Username</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="Enter your username"
                               size="35"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="email">Email Address</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email"
                               size="35"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="password">Password</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               size="35"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember Me</label>

                        &nbsp;&nbsp;

                        <a href="#">Forgot Password?</a>
                    </td>
                </tr>

                <tr>
                    <td align="center">
                        <button type="submit">
                            Login to Account
                        </button>
                    </td>
                </tr>
            </table>
        </form>
        <hr width="350">
        <p>Don't have an account?</p>
        <p><a href="register.html">Create a New Account</a></p>
    </center>
</body>
</html>
